name: Temporary Course Analytics Patch

on:
  push:
    branches:
      - ams-dashboard-reporting-redesign

permissions:
  contents: write

jobs:
  patch-course-analytics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ams-dashboard-reporting-redesign
          fetch-depth: 0

      - name: Patch Course Analytics only
        run: python .github/tmp_patch_course_analytics.py

      - name: Commit scoped report changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/ams-dashboard.js css/ams-dashboard.css
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Replace Course Analytics with enrollment report"
          git push origin HEAD:ams-dashboard-reporting-redesign
